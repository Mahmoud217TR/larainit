[package]
name = "larainit"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
description = "Disposable Docker toolchain commands for Laravel projects"
license = "MIT"

[dependencies]
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
nix = { version = "=0.31.3", default-features = false, features = ["user", "fs", "signal", "term"] }
signal-hook = { version = "=0.4.5", default-features = false }
